<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <!-- 背景（少し丸みのあるカード） -->
  <rect
    x="4"
    y="4"
    width="56"
    height="56"
    rx="10"
    ry="10"
    fill="#ffffff"
    stroke="#e0e0e0"
    stroke-width="2"
  />

  <!-- カレンダーの上部バー -->
  <rect
    x="4"
    y="4"
    width="56"
    height="14"
    rx="10"
    ry="10"
    fill="#f44336"
  />

  <!-- 左上の赤い丸（日の丸イメージ） -->
  <circle
    cx="14"
    cy="11"
    r="4"
    fill="#ffffff"
    opacity="0.9"
  />

  <!-- 中央の「和」（和暦） -->
  <text
    x="32"
    y="38"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="22"
    font-family="'Yu Gothic', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif"
    fill="#333333"
  >
    和
  </text>

  <!-- 右下の "AD"（西暦） -->
  <text
    x="46"
    y="50"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="10"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    fill="#f44336"
  >
    AD
  </text>
</svg>
